<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15151c"/>
      <stop offset="1" stop-color="#08080d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="head" x1="168" y1="80" x2="344" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="handle" x1="256" y1="320" x2="256" y2="436" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a2a32"/>
      <stop offset="1" stop-color="#141419"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square backdrop -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <ellipse cx="256" cy="216" rx="190" ry="210" fill="url(#glow)"/>

  <!-- Mic head capsule -->
  <rect x="168" y="80" width="176" height="244" rx="88" fill="url(#head)" stroke="rgba(255,255,255,0.22)" stroke-width="3"/>

  <!-- Top ellipse accent -->
  <ellipse cx="256" cy="128" rx="88" ry="22" fill="none" stroke="rgba(103,232,249,0.75)" stroke-width="4"/>

  <!-- Grille lines -->
  <g stroke="rgba(10,10,16,0.30)" stroke-width="12" stroke-linecap="round">
    <line x1="196" y1="178" x2="316" y2="178"/>
    <line x1="196" y1="222" x2="316" y2="222"/>
    <line x1="196" y1="266" x2="316" y2="266"/>
  </g>

  <!-- Band -->
  <rect x="214" y="326" width="84" height="26" rx="13" fill="url(#handle)" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>

  <!-- Neck -->
  <rect x="240" y="350" width="32" height="22" fill="#1a1a1e"/>

  <!-- Handle -->
  <path d="M230 370 L282 370 L272 430 Q256 444 240 430 Z" fill="url(#handle)" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>

  <!-- Glowing base ring -->
  <ellipse cx="256" cy="432" rx="46" ry="13" fill="none" stroke="#a78bfa" stroke-width="6" opacity="0.95"/>
</svg>
